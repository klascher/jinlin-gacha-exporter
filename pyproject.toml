[project]
name = "jinlin-gacha-exporter"
# 与 gacha_exporter/__init__.py 的 __version__ 保持一致的唯一版本源（打包更新说明 §4.1）
version = "0.4.0"
description = "金鳞抽卡导出工具"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "scapy>=2.5.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gacha_exporter*"]

[tool.setuptools.package-data]
gacha_exporter = ["data/*.json"]
